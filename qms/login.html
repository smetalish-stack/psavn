<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý tài liệu tiêu chuẩn</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="login-wrap">
        <div class="lang-bar">
            <button data-lang-btn="vi" onclick="setLoginLang('vi')">VI</button>
            <button data-lang-btn="ko" onclick="setLoginLang('ko')">한국어</button>
            <button data-lang-btn="en" onclick="setLoginLang('en')">EN</button>
        </div>

        <div class="login-logo">
            <span class="logo-icon">&#128203;</span>
            <h1 data-i18n="login.title">Quản lý tài liệu tiêu chuẩn</h1>
            <p data-i18n="login.subtitle">Hệ thống quản lý chất lượng IATF 16949</p>
        </div>

        <div class="login-card">
            <h2 data-i18n="login.heading">Đăng nhập</h2>
            <div class="info-msg" id="info-msg" style="display:none"></div>
            <div class="field">
                <label for="username" data-i18n="login.username">Tài khoản</label>
                <input type="text" id="username" data-i18n-placeholder="login.username_placeholder"
                       placeholder="Nhập tài khoản" autocomplete="username">
            </div>
            <div class="field">
                <label for="password" data-i18n="login.password">Mật khẩu</label>
                <input type="password" id="password" data-i18n-placeholder="login.password_placeholder"
                       placeholder="Nhập mật khẩu" autocomplete="current-password">
            </div>
            <button class="btn-login" id="btn-login" onclick="doLogin()" data-i18n="login.submit">Đăng nhập</button>
            <div class="error-msg" id="error-msg"></div>
        </div>

        <div class="back-link">
            <a href="../" data-i18n="login.back">← Quay lại psavn.com</a>
        </div>
    </div>

    <script>
        const API_BASE = 'https://qms-server-production.up.railway.app';
        const SUPPORTED_LANGS = ['vi', 'ko', 'en'];
        let _trans = {};
        let _lang = 'vi';

        (function() {
            if (sessionStorage.getItem('qms_token')) window.location.replace('index.html');
        })();

        async function _loadLang(lang) {
            if (_trans[lang]) return;
            try {
                const r = await fetch(`lang/${lang}.json`);
                // lang JSON 에 BOM 이 섞이면 JSON.parse 가 터진다
                _trans[lang] = JSON.parse((await r.text()).replace(/^﻿/, ''));
            } catch (e) { _trans[lang] = {}; }
        }

        function _t(key) {
            const keys = key.split('.');
            let v = _trans[_lang];
            for (const k of keys) { if (v && typeof v === 'object') v = v[k]; else return key; }
            return typeof v === 'string' ? v : key;
        }

        function _apply() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                el.textContent = _t(el.getAttribute('data-i18n'));
            });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                el.placeholder = _t(el.getAttribute('data-i18n-placeholder'));
            });
            document.querySelectorAll('[data-lang-btn]').forEach(btn => {
                btn.classList.toggle('active', btn.getAttribute('data-lang-btn') === _lang);
            });
            document.documentElement.lang = _lang;
            document.title = _t('login.title');
            // 안내·오류 문구도 언어를 따라간다
            const info = document.getElementById('info-msg');
            if (info.dataset.key) info.textContent = _t(info.dataset.key);
            const err = document.getElementById('error-msg');
            if (err.dataset.key) err.textContent = _t(err.dataset.key);
        }

        async function setLoginLang(lang) {
            if (!SUPPORTED_LANGS.includes(lang)) return;
            _lang = lang;
            localStorage.setItem('qms_lang', lang);
            await _loadLang(lang);
            _apply();
        }

        (async function() {
            const stored = localStorage.getItem('qms_lang');
            const browser = navigator.language.slice(0, 2);
            if (stored && SUPPORTED_LANGS.includes(stored)) _lang = stored;
            else if (SUPPORTED_LANGS.includes(browser)) _lang = browser;
            await _loadLang(_lang);

            // 세션 만료로 되돌아온 경우 안내
            const notice = sessionStorage.getItem('qms_notice');
            if (notice) {
                sessionStorage.removeItem('qms_notice');
                const info = document.getElementById('info-msg');
                info.dataset.key = notice;
                info.style.display = 'block';
            }
            _apply();
        })();

        document.getElementById('username').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('password').focus(); });
        document.getElementById('password').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

        async function doLogin() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const btn = document.getElementById('btn-login');
            if (!username || !password) { showError('login.error_empty'); return; }
            btn.disabled = true;
            btn.textContent = _t('login.submitting');
            document.getElementById('error-msg').style.display = 'none';
            try {
                const res = await fetch(`${API_BASE}/api/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (res.ok && data.token) {
                    sessionStorage.setItem('qms_token', data.token);
                    sessionStorage.setItem('qms_user', JSON.stringify(data.user));
                    window.location.replace('index.html');
                } else {
                    showError(res.status === 429 ? 'login.error_locked' : 'login.error_failed');
                    document.getElementById('password').value = '';
                }
            } catch (e) {
                showError('login.error_server');
            } finally {
                btn.disabled = false;
                btn.textContent = _t('login.submit');
            }
        }

        function showError(key) {
            const el = document.getElementById('error-msg');
            el.dataset.key = key;
            el.textContent = _t(key);
            el.style.display = 'block';
        }
    </script>
</body>
</html>
