<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý tài liệu tiêu chuẩn</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Header -->
    <header class="app-header">
        <div class="header-left">
            <span class="header-icon">&#128203;</span>
            <div>
                <h1 data-i18n="title">Quản lý tài liệu tiêu chuẩn</h1>
                <span class="header-sub" data-i18n="subtitle">Hệ thống quản lý chất lượng IATF 16949</span>
            </div>
        </div>
        <div class="header-right">
            <span id="header-user" class="header-date" style="opacity:.8"></span>

            <!-- Language Switcher -->
            <div class="lang-switcher">
                <button data-lang-btn="vi" onclick="I18n.setLang('vi')">VI</button>
                <button data-lang-btn="ko" onclick="I18n.setLang('ko')">한국어</button>
                <button data-lang-btn="en" onclick="I18n.setLang('en')">EN</button>
            </div>

            <a href="../" class="btn-back" data-i18n="back_to_psavn">← psavn.com</a>
            <button class="btn-back" onclick="App.logout()" style="border-color:rgba(255,255,255,.4);cursor:pointer;background:none">&#128274; <span data-i18n="logout">Đăng xuất</span></button>
        </div>
    </header>

    <div class="app-container">
        <nav class="tab-nav">
            <a href="index.html" data-nav="documents" data-i18n="nav.documents">Tài liệu</a>
            <a href="forms.html" data-nav="forms" data-i18n="nav.forms">Biểu mẫu</a>
        </nav>

        <div class="panel">
            <div class="doc-head">
                <div class="doc-title">
                    <a href="index.html" data-i18n="doc.back_to_list">Về danh sách</a>
                    <h2 id="doc-name">…</h2>
                    <div class="doc-meta" id="doc-meta"></div>
                </div>
                <div class="doc-actions">
                    <button class="btn" id="btn-download" hidden data-i18n="file.download_src">Tải tệp gốc</button>
                    <button class="btn" id="btn-newtab" hidden data-i18n="file.open_new_tab">Mở ở tab mới</button>
                </div>
            </div>
            <div class="notice" id="fallback" hidden></div>
            <div class="notice error" id="error" hidden></div>
        </div>

        <div class="panel">
            <div class="viewer" id="viewer">
                <div class="viewer-msg" data-i18n="file.loading">Đang tải tài liệu…</div>
            </div>
        </div>

        <div class="panel">
            <h2 data-i18n="doc.rev_history">Lịch sử sửa đổi</h2>
            <div class="table-scroll">
                <table>
                    <thead>
                        <tr>
                            <th data-i18n="doc.rev">Số sửa đổi</th>
                            <th data-i18n="doc.rev_date">Ngày sửa đổi</th>
                            <th data-i18n="doc.rev_content">Nội dung sửa đổi</th>
                            <th data-i18n="doc.outdated_date">Ngày hết hiệu lực</th>
                            <th data-i18n="filter.status">Trạng thái</th>
                        </tr>
                    </thead>
                    <tbody id="rev-rows"></tbody>
                </table>
            </div>
            <div class="notice" id="rev-note" hidden data-i18n="doc.history_only"></div>
        </div>

        <div class="panel" id="forms-panel" hidden>
            <h2 data-i18n="doc.related_forms">Biểu mẫu liên quan</h2>
            <div class="table-scroll">
                <table>
                    <thead>
                        <tr>
                            <th data-i18n="form.no">Mã biểu mẫu</th>
                            <th data-i18n="form.name">Tên biểu mẫu</th>
                            <th data-i18n="doc.retention">Thời gian lưu trữ</th>
                        </tr>
                    </thead>
                    <tbody id="form-rows"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="js/i18n.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script>App.init('document');</script>
</body>
</html>
