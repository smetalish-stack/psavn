<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý tài liệu tiêu chuẩn</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Header -->
    <header class="app-header">
        <div class="header-left">
            <span class="header-icon">&#128203;</span>
            <div>
                <h1 data-i18n="title">Quản lý tài liệu tiêu chuẩn</h1>
                <span class="header-sub" data-i18n="subtitle">Hệ thống quản lý chất lượng IATF 16949</span>
            </div>
        </div>
        <div class="header-right">
            <span id="header-user" class="header-date" style="opacity:.8"></span>
            <div class="lang-switcher">
                <button data-lang-btn="vi" onclick="I18n.setLang('vi')">VI</button>
                <button data-lang-btn="ko" onclick="I18n.setLang('ko')">한국어</button>
                <button data-lang-btn="en" onclick="I18n.setLang('en')">EN</button>
            </div>
            <a href="../" class="btn-back" data-i18n="back_to_psavn">← psavn.com</a>
            <button class="btn-back" onclick="App.logout()" style="border-color:rgba(255,255,255,.4);cursor:pointer;background:none">&#128274; <span data-i18n="logout">Đăng xuất</span></button>
        </div>
    </header>

    <div class="app-container">
        <nav class="tab-nav">
            <a href="index.html" data-nav="documents" data-i18n="nav.documents">Tài liệu</a>
            <a href="forms.html" data-nav="forms" data-i18n="nav.forms">Biểu mẫu</a>
            <a href="drawings.html" data-nav="drawings" data-i18n="nav.drawings">Bản vẽ</a>
            <a href="history.html" data-nav="history" data-i18n="nav.history" hidden>Lịch sử truy cập</a>
            <a href="batch.html" data-nav="batch" data-i18n="nav.batch" hidden>Sửa đổi hàng loạt</a>
        </nav>

        <div class="panel">
            <div class="doc-head">
                <div class="doc-title">
                    <a href="drawings.html" data-i18n="drawing.back">Về danh sách bản vẽ</a>
                    <h2 id="d-name">…</h2>
                    <div class="doc-meta" id="d-meta"></div>
                    <div class="copy-no" id="d-copy" hidden></div>
                </div>
                <div class="doc-actions">
                    <button class="btn btn-primary" id="d-revise-btn" hidden data-i18n="revise.button">Đăng ký sửa đổi</button>
                    <button class="btn" id="d-download" hidden data-i18n="file.download_src">Tải tệp gốc</button>
                </div>
            </div>
            <div class="notice" id="d-nda" hidden data-i18n="drawing.nda_notice">
                Bản vẽ này thuộc phạm vi NDA.
            </div>
            <div class="notice error" id="d-error" hidden></div>
        </div>

        <!-- 개정 등록 -->
        <form class="panel" id="d-rev-form" hidden>
            <h2 data-i18n="revise.heading">Đăng ký sửa đổi</h2>
            <div class="form-grid">
                <div class="field">
                    <label for="r-rev" data-i18n="drawing.rev">Số sửa đổi</label>
                    <input type="text" id="r-rev" required>
                </div>
                <div class="field">
                    <label for="r-date" data-i18n="doc.rev_date">Ngày sửa đổi</label>
                    <input type="date" id="r-date">
                </div>
                <div class="field">
                    <label for="r-pdf" data-i18n="drawing.pdf">PDF (bắt buộc)</label>
                    <input type="file" id="r-pdf" accept="application/pdf,.pdf" required>
                </div>
                <div class="field">
                    <label for="r-src" data-i18n="drawing.src">Tệp gốc</label>
                    <input type="file" id="r-src">
                </div>
            </div>
            <div class="field">
                <label for="r-content" data-i18n="doc.rev_content">Nội dung sửa đổi</label>
                <input type="text" id="r-content">
            </div>
            <div class="notice" data-i18n="drawing.obsolete_notice">
                Bản sửa đổi hiện hành sẽ tự động hết hiệu lực.
            </div>
            <div class="notice error" id="r-error" hidden></div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary" id="r-submit" data-i18n="revise.submit">Đăng ký</button>
                <button type="button" class="btn" id="r-cancel" data-i18n="revise.cancel">Hủy</button>
            </div>
        </form>

        <div class="panel">
            <div class="viewer" id="d-viewer">
                <div class="viewer-msg" data-i18n="file.loading">Đang tải tài liệu…</div>
            </div>
        </div>

        <div class="panel">
            <h2 data-i18n="doc.rev_history">Lịch sử sửa đổi</h2>
            <ol class="timeline" id="d-timeline"></ol>
        </div>
    </div>

    <script src="js/i18n.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script>App.init('drawing');</script>
</body>
</html>
