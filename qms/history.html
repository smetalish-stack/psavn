<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý tài liệu tiêu chuẩn</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Header -->
    <header class="app-header">
        <div class="header-left">
            <span class="header-icon">&#128203;</span>
            <div>
                <h1 data-i18n="title">Quản lý tài liệu tiêu chuẩn</h1>
                <span class="header-sub" data-i18n="subtitle">Hệ thống quản lý chất lượng IATF 16949</span>
            </div>
        </div>
        <div class="header-right">
            <span id="header-user" class="header-date" style="opacity:.8"></span>

            <!-- Language Switcher -->
            <div class="lang-switcher">
                <button data-lang-btn="vi" onclick="I18n.setLang('vi')">VI</button>
                <button data-lang-btn="ko" onclick="I18n.setLang('ko')">한국어</button>
                <button data-lang-btn="en" onclick="I18n.setLang('en')">EN</button>
            </div>

            <a href="../" class="btn-back" data-i18n="back_to_psavn">← psavn.com</a>
            <button class="btn-back" onclick="App.logout()" style="border-color:rgba(255,255,255,.4);cursor:pointer;background:none">&#128274; <span data-i18n="logout">Đăng xuất</span></button>
        </div>
    </header>

    <div class="app-container">
        <nav class="tab-nav">
            <a href="index.html" data-nav="documents" data-i18n="nav.documents">Tài liệu</a>
            <a href="forms.html" data-nav="forms" data-i18n="nav.forms">Biểu mẫu</a>
            <a href="drawings.html" data-nav="drawings" data-i18n="nav.drawings">Bản vẽ</a>
            <a href="history.html" data-nav="history" data-i18n="nav.history">Lịch sử truy cập</a>
            <a href="batch.html" data-nav="batch" data-i18n="nav.batch" hidden>Sửa đổi hàng loạt</a>
        </nav>

        <div class="panel" id="summary-panel">
            <h2 data-i18n="history.summary">Tổng hợp 30 ngày gần đây</h2>
            <div class="stat-row" id="stats"></div>
        </div>

        <div class="panel">
            <div class="filters">
                <input type="search" id="f-doc" data-i18n-placeholder="history.filter_doc" placeholder="Mã tài liệu">
                <input type="search" id="f-user" data-i18n-placeholder="history.filter_user" placeholder="Tài khoản">
                <select id="f-action">
                    <option value="" data-i18n="history.action">Hành động</option>
                    <option value="view" data-i18n="history.action_view">Xem</option>
                    <option value="download" data-i18n="history.action_download">Tải xuống</option>
                    <option value="login" data-i18n="history.action_login">Đăng nhập</option>
                    <option value="search" data-i18n="history.action_search">Tìm kiếm</option>
                </select>
                <input type="date" id="f-from" data-i18n-title="history.from">
                <input type="date" id="f-to" data-i18n-title="history.to">
                <button class="btn" id="f-reset" data-i18n="filter.reset">Đặt lại</button>
                <button class="btn" id="btn-csv" data-i18n="history.export">Xuất CSV</button>
                <span class="count" id="count"></span>
            </div>
        </div>

        <div class="panel">
            <div class="table-scroll">
                <table>
                    <thead>
                        <tr>
                            <th data-i18n="history.copy_no">Số bản phát hành</th>
                            <th data-i18n="history.at">Thời gian</th>
                            <th data-i18n="history.user">Tài khoản</th>
                            <th data-i18n="history.action">Hành động</th>
                            <th data-i18n="doc.no">Mã tài liệu</th>
                            <th data-i18n="doc.rev">Số sửa đổi</th>
                            <th data-i18n="history.lang">Ngôn ngữ</th>
                            <th data-i18n="history.ip">IP</th>
                        </tr>
                    </thead>
                    <tbody id="rows">
                        <tr><td colspan="8" class="table-msg" data-i18n="msg.loading">Đang tải…</td></tr>
                    </tbody>
                </table>
            </div>
            <div class="pager">
                <button class="btn" id="prev" data-i18n="history.prev">◀ Trước</button>
                <span id="page-info"></span>
                <button class="btn" id="next" data-i18n="history.next">Sau ▶</button>
            </div>
        </div>
    </div>

    <script src="js/i18n.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script>App.init('history');</script>
</body>
</html>
